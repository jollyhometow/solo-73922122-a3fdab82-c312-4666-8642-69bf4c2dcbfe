services:
  api:
    build: .
    image: watershed-monitor-api
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/app.db
    volumes:
      - watershed-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  watershed-data:
